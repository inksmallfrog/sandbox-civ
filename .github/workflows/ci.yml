name: ci

on:
  # 只响应 main 的 push 与 PR：push tag 或推其他分支都不该白耗 Runner。
  # 配合 AGENTS §8 的推送纪律——只有 M 级改动才推到 GitHub 取证。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  GODOT_VERSION: 4.7.2
  # 平台范围：**Windows + Linux 双系统**。设计者 2026-11-13 先要求 Windows-only，
  # 随后又要求把 Linux 验证加回来：跨 OS 同种子同哈希是 §10.7 的硬主张，必须两边都在跑。
  EXPECTED_SMOKE_HASH: fc88ca36ce90fb37

jobs:
  build-test:
    name: 构建与单测（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 构建解决方案
        run: dotnet build -v q --nologo
      - name: 运行全部测试
        run: dotnet test --no-build --nologo

  sim-headless:
    name: 无头模拟（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 构建解决方案与插件
        run: dotnet build -v q --nologo
      - name: 校验数据包、清单与结算表
        run: dotnet run --project src/HexaCiv.Cli --no-build -- check
      - name: 确定性自检
        run: dotnet run --project src/HexaCiv.Cli --no-build -- hash --seed 99 --turns 50
      - name: 存档回放等价自检
        run: dotnet run --project src/HexaCiv.Cli --no-build -- replay --seed 5 --turns 20 --at 12
      - name: 生成二百年基线报告
        run: dotnet run --project src/HexaCiv.Cli --no-build -- run --seed 42 --turns 200 --headless --out analysis/out/demo.csv
      - name: 上传基线报告
        uses: actions/upload-artifact@v4
        with:
          name: sim-baseline-${{ matrix.os }}
          path: analysis/out/demo.csv
          if-no-files-found: error

  godot-smoke:
    name: Godot 跨宿主冒烟（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 安装 Godot .NET ${{ env.GODOT_VERSION }}
        shell: pwsh
        run: |
          $version = $env:GODOT_VERSION
          if ($IsWindows) {
            $asset = "Godot_v${version}-stable_mono_win64.zip"
          } else {
            $asset = "Godot_v${version}-stable_mono_linux_x86_64.zip"
          }

          $archive = Join-Path $env:RUNNER_TEMP $asset
          $destination = Join-Path $env:RUNNER_TEMP "godot"
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/${asset}" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force

          # Windows 上的编辑器 exe 是 GUI 子系统程序：`& $exe` 不会阻塞、也不会写
          # $LASTEXITCODE（保持 $null），于是 `$null -ne 0` 恒真、误判成启动失败。
          # 对策：优先用同时分发的 _console.exe（它把 --version 输出到 stdout 并正常退出），
          # 并用 Start-Process -Wait 判退出码。
          if ($IsWindows) {
            $binary = Get-ChildItem -Path $destination -Recurse -File -Filter "Godot*_console.exe" | Select-Object -First 1
            if ($null -eq $binary) { $binary = Get-ChildItem -Path $destination -Recurse -File -Filter "Godot*.exe" | Select-Object -First 1 }
          } else {
            $binary = Get-ChildItem -Path $destination -Recurse -File -Filter "Godot*linux*x86_64" | Select-Object -First 1
          }
          if ($null -eq $binary) { throw "Godot 压缩包中找不到可执行文件（$asset）" }
          Get-ChildItem -Path $destination -Recurse -File | Select-Object -ExpandProperty FullName | Write-Host

          if (-not $IsWindows) { chmod +x $binary.FullName }

          $stdout = Join-Path $env:RUNNER_TEMP "godot-version.log"
          # -NoNewWindow 只在 Windows 有意义；Linux 上用同一份 splat 去掉它，
          # 否则 pwsh 在 ubuntu 上会报参数不支持。
          $start = @{
            FilePath               = $binary.FullName
            ArgumentList           = "--version"
            Wait                   = $true
            PassThru               = $true
            RedirectStandardOutput = $stdout
          }
          if ($IsWindows) { $start.NoNewWindow = $true }
          $proc = Start-Process @start
          $ver = if (Test-Path $stdout) { (Get-Content $stdout -Raw).Trim() } else { "" }
          Write-Host "Godot 版本输出：'$ver'（退出码 $($proc.ExitCode)）"
          if ($proc.ExitCode -ne 0) { throw "Godot 无法启动，退出码 $($proc.ExitCode)" }
          if ($ver -notmatch [regex]::Escape($version)) { throw "Godot 版本不符：期望 $version，实际 '$ver'" }

          $binaryPath = $binary.FullName.Replace('\', '/')
          "GODOT_BIN=$binaryPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 构建解决方案与插件
        run: dotnet build -v q --nologo
      - name: 单独构建 GodotShell
        run: dotnet build src/GodotShell/HexaCiv.GodotShell.csproj -v q --nologo
      - name: CLI 对账
        shell: bash
        run: |
          mkdir -p analysis/out
          dotnet run --project src/HexaCiv.Cli --no-build -- hash --seed 7 --turns 6 --script scripts/godot-smoke.txt 2>&1 | tee analysis/out/cli-smoke.log
          grep -F "末态 ${EXPECTED_SMOKE_HASH}" analysis/out/cli-smoke.log
      - name: Godot 冒烟与哈希对账
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path src/GodotShell -- --smoke 2>&1 | tee analysis/out/godot-smoke.log
          grep -F "SMOKE PASS" analysis/out/godot-smoke.log
          grep -F "smoke 第 6 回合 hash=${EXPECTED_SMOKE_HASH}" analysis/out/godot-smoke.log
      - name: 上传跨宿主对账日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-${{ matrix.os }}
          path: analysis/out/*-smoke.log
          if-no-files-found: warn
